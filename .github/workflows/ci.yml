name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mac — build & self-test
        working-directory: mac
        run: |
          swift build
          .build/debug/NotchDrop --selftest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Android — release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ND_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ND_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          KEYS="$RUNNER_TEMP/keys"
          mkdir -p "$KEYS"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYS/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=notchdrop\nkeyPassword=%s\n' \
            "$KEYS/release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > "$KEYS/keystore.properties"
          echo "ND_KEYSTORE_PROPERTIES=$KEYS/keystore.properties" >> "$GITHUB_ENV"

      - name: Android — unit tests (incl. Swift interop) & release build
        working-directory: android
        run: ./gradlew :app:testGithubDebugUnitTest :app:assembleGithubRelease :app:bundlePlayRelease

      - uses: actions/upload-artifact@v4
        with:
          name: NotchDrop-android
          path: android/app/build/outputs/apk/github/release/*.apk
